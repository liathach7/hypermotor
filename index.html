<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Car Game – Random Road with Traffic Light</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }

        #hud {
            position: fixed; top: 20px; left: 45%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center; pointer-events: none; z-index: 10;
        }
        .hud-panel {
            background: rgba(0,0,0,0.75); color: #fff; padding: 12px 20px; border-radius: 30px;
            backdrop-filter: blur(6px); border: 2px solid rgba(255,255,255,0.25);
            text-align: center; min-width: 90px;
        }
        .hud-panel .value { font-size: 2rem; font-weight: 700; color: #4fc3f7; line-height: 1; }
        .hud-panel .label { font-size: 0.75rem; color: #aaa; letter-spacing: 0.5px; margin-top: 2px; }
        .hud-panel .unit { font-size: 0.8rem; color: #aaa; margin-left: 2px; }
        #fuel-panel .value { color: #ffb74d; }
        #time-panel .value { color: #81c784; }

        #controls-hint {
            background: rgba(0,0,0,0.7); color: #ccc; padding: 10px 18px; border-radius: 25px;
            font-size: 0.85rem; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.2);
            text-align: center; line-height: 1.5; pointer-events: none;
        }
        #controls-hint span.key {
            display: inline-block; background: rgba(255,255,255,0.2); padding: 3px 8px;
            border-radius: 5px; margin: 0 2px; font-weight: 600; color: #fff; min-width: 18px; text-align: center;
        }

        #completion-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 30px 50px; border-radius: 30px;
            backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.4);
            text-align: center; z-index: 20; display: none; pointer-events: none;
        }
        #completion-overlay h2 { font-size: 2.2rem; margin-bottom: 20px; color: #ffd54f; }
        #completion-overlay .result { font-size: 1.3rem; margin: 10px 0; }
        #completion-overlay .result span { font-weight: 700; color: #4fc3f7; }
        /* ============================================
        TOUCH CONTROLS (mobile support)
        ============================================ */

        /* Hide the touch groups by default (desktop) */
        #touch-left-group,
        #touch-right-group {
            display: none;
            position: fixed;
            bottom: 30px;
            z-index: 40;
            gap: 10px;
            pointer-events: none;
        }

        /* Show on touch screen devices (coarse pointer) */
        @media (pointer: coarse) {
            #touch-left-group {
                display: flex;
                left: 20px;               /* ← change horizontal position */
            }
            #touch-right-group {
                display: flex;
                right: 20px;              /* ← change horizontal position */
            }
        }

        /* The buttons themselves */
        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            pointer-events: auto;
        }
        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div id="speed-panel" class="hud-panel">
            <div class="value" id="speed-value">0</div><span class="unit">km/h</span>
            <div class="label">SPEED</div>
        </div>
        <div id="fuel-panel" class="hud-panel">
            <div class="value" id="fuel-value">0.0</div><span class="unit">L</span>
            <div class="label">FUEL USED</div>
        </div>
        <div id="time-panel" class="hud-panel">
            <div class="value" id="time-value">0.0</div><span class="unit">s</span>
            <div class="label">TIME</div>
        </div>
        <!-- <div id="controls-hint">
            <span class="key">↑</span> Forward &nbsp; <span class="key">↓</span> Reverse<br>
            <span class="key">←</span> Turn Left &nbsp; <span class="key">→</span> Turn Right
        </div> -->
    </div>

    <div id="completion-overlay">
        <h2>🏁 COURSE COMPLETE!</h2>
        <div class="result">⏱️ Time: <span id="final-time">0.0</span> s</div>
        <div class="result">⛽ Fuel used: <span id="final-fuel">0.0</span> L</div>
    </div>
    <!-- Touch controls (visible on mobile) -->
    <div id="touch-left-group">
        <div class="touch-btn" id="btn-left">←</div>
    </div>
    <div id="touch-right-group">
        <div class="touch-btn" id="btn-right">→</div>
        <div class="touch-btn" id="btn-up">↑</div>
        <div class="touch-btn" id="btn-down">↓</div>
        
    </div>


    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================
        // 1. RENDERER, SCENE, CAMERA, LIGHTING
        // ============================================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87CEEB');
        scene.fog = new THREE.Fog('#87CEEB', 80, 250);

        const VIEW_HEIGHT = 60;
        let viewWidth = VIEW_HEIGHT * (window.innerWidth / window.innerHeight);
        const camera = new THREE.OrthographicCamera(
            -viewWidth / 2, viewWidth / 2,
            VIEW_HEIGHT / 2, -VIEW_HEIGHT / 2,
            0.1, 300
        );
        camera.position.set(0, 60, 0);
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight('#ffffff', 1.2);
        scene.add(ambientLight);
        const hemisphereLight = new THREE.HemisphereLight('#87CEEB', '#4a7c3f', 0.6);
        scene.add(hemisphereLight);
        const sunLight = new THREE.DirectionalLight('#ffffff', 2.5);
        sunLight.position.set(40, 50, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 200;
        sunLight.shadow.camera.left = -80;
        sunLight.shadow.camera.right = 80;
        sunLight.shadow.camera.top = 80;
        sunLight.shadow.camera.bottom = -80;
        sunLight.shadow.bias = -0.0002;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        // ============================================
        // 2. MATERIALS
        // ============================================
        const matGrass = new THREE.MeshLambertMaterial({ color: '#5a9e4b' });
        const matRoadMain = new THREE.MeshLambertMaterial({ color: '#4a4a4a' });
        const matTrunk = new THREE.MeshLambertMaterial({ color: '#8B5E3C' });
        const matCanopy = new THREE.MeshLambertMaterial({ color: '#3d7a28' });
        const matCanopyLight = new THREE.MeshLambertMaterial({ color: '#5a9e3a' });
        const matCarBody = new THREE.MeshPhongMaterial({ color: '#e63946', specular: '#ffffff', shininess: 35 });
        const matCarWheel = new THREE.MeshLambertMaterial({ color: '#1a1a1a' });
        const matCarShadow = new THREE.MeshBasicMaterial({ color: '#000000', transparent: true, opacity: 0.35 });
        const matCarWindow = new THREE.MeshPhongMaterial({ color: '#87CEEB', specular: '#ffffff', shininess: 90, transparent: true, opacity: 0.7 });
        const matStart = new THREE.MeshLambertMaterial({ color: '#4caf50' });
        const matEnd = new THREE.MeshLambertMaterial({ color: '#f44336' });

        // Road constants
        const ROAD_HALF_WIDTH = 3.75;
        const ROAD_HEIGHT = 0.06;
        const ROUNDABOUT_RADIUS = 12;

        // ============================================
        // 3. RANDOM MAP GENERATION (radial entry roundabouts)
        // ============================================
        function generateRandomRoadMap() {
            const END = { x: 2000, z: 0 };
            const START = { x: 0, z: 0 };
            const FIRST_SEGMENT_END = { x: 40, z: 0 };

            const ROUNDABOUT_RADIUS = 12;
            const MIN_ENTRY_TO_EXIT_ANGLE_DEG = 45;
            const MIN_ENTRY_TO_EXIT_ANGLE_RAD = MIN_ENTRY_TO_EXIT_ANGLE_DEG * Math.PI / 180;

            const MIN_ROUNDABOUTS = 1;
            const MAX_ROUNDABOUTS = 3;
            const numRoundabouts = MIN_ROUNDABOUTS + Math.floor(Math.random() * (MAX_ROUNDABOUTS - MIN_ROUNDABOUTS + 1));

            const MIN_STEPS_BEFORE_ROUNDABOUT = 2;
            const MAX_STEPS_BEFORE_ROUNDABOUT = 5;

            const MIN_SEGMENT_LENGTH = 20;
            const MAX_SEGMENT_LENGTH = 40;

            const RANDOM_TURN_AMOUNT = 0.6;   // radians
            const BASE_CORRECTION = 0.3;
            const MAX_CORRECTION = 0.8;
            const FINAL_CORRECTION_BASE = 0.5;
            const FINAL_CORRECTION_DIVISOR = 10;

            const sections = [];
            const roundabouts = [];

            let pos = { ...START };
            let heading = Math.atan2(FIRST_SEGMENT_END.z - START.z, FIRST_SEGMENT_END.x - START.x);
            let currentSection = [ { ...START }, { ...FIRST_SEGMENT_END } ];
            pos = { ...FIRST_SEGMENT_END };

            for (let i = 0; i < numRoundabouts; i++) {
                const stepsBefore = MIN_STEPS_BEFORE_ROUNDABOUT +
                    Math.floor(Math.random() * (MAX_STEPS_BEFORE_ROUNDABOUT - MIN_STEPS_BEFORE_ROUNDABOUT + 1));

                for (let s = 0; s < stepsBefore; s++) {
                    const idealAngle = Math.atan2(END.z - pos.z, END.x - pos.x);
                    const diff = idealAngle - heading;
                    const wrappedDiff = Math.atan2(Math.sin(diff), Math.cos(diff));

                    const distToEnd = Math.hypot(END.x - pos.x, END.z - pos.z);
                    const totalDist = Math.hypot(END.x - START.x, END.z - START.z);
                    const proximity = 1 - distToEnd / totalDist;
                    const correctionStrength = BASE_CORRECTION + (MAX_CORRECTION - BASE_CORRECTION) * proximity;

                    const randomTurn = (Math.random() + Math.random() - 1) * RANDOM_TURN_AMOUNT;
                    const turn = wrappedDiff * correctionStrength + randomTurn * (1 - correctionStrength);

                    heading += turn;
                    const length = MIN_SEGMENT_LENGTH + Math.random() * (MAX_SEGMENT_LENGTH - MIN_SEGMENT_LENGTH);
                    pos.x += length * Math.cos(heading);
                    pos.z += length * Math.sin(heading);
                    currentSection.push({ ...pos });
                }

                // Entry: road endpoint is on circle, centre is radially ahead
                const entryPoint = { ...pos };
                const directionX = Math.cos(heading);
                const directionZ = Math.sin(heading);
                const centre = {
                    cx: entryPoint.x + directionX * ROUNDABOUT_RADIUS,
                    cz: entryPoint.z + directionZ * ROUNDABOUT_RADIUS,
                    radius: ROUNDABOUT_RADIUS
                };
                roundabouts.push(centre);

                const entryAngle = Math.atan2(entryPoint.z - centre.cz, entryPoint.x - centre.cx);

                const baseExitAngle = Math.atan2(END.z - centre.cz, END.x - centre.cx);
                let exitAngle;
                let attempts = 0;
                do {
                    exitAngle = baseExitAngle + (Math.random() - 0.5) * 1.5;
                    attempts++;
                } while (Math.abs(exitAngle - entryAngle) < MIN_ENTRY_TO_EXIT_ANGLE_RAD && attempts < 50);

                if (Math.abs(exitAngle - entryAngle) < MIN_ENTRY_TO_EXIT_ANGLE_RAD) {
                    exitAngle = entryAngle + (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 2);
                }

                const exitPoint = {
                    x: centre.cx + ROUNDABOUT_RADIUS * Math.cos(exitAngle),
                    z: centre.cz + ROUNDABOUT_RADIUS * Math.sin(exitAngle)
                };

                sections.push(currentSection);
                currentSection = [ { ...exitPoint } ];
                pos = { ...exitPoint };
                heading = exitAngle;
            }

            let safety = 0;
            while (Math.hypot(END.x - pos.x, END.z - pos.z) > 5 && safety < 200) {
                if (safety > 5) {
                    const checker = 1;
                    break
                }
                const idealAngle = Math.atan2(END.z - pos.z, END.x - pos.x);
                const diff = idealAngle - heading;
                const wrappedDiff = Math.atan2(Math.sin(diff), Math.cos(diff));
                const distToEnd = Math.hypot(END.x - pos.x, END.z - pos.z);

                const correction = Math.min(FINAL_CORRECTION_BASE, FINAL_CORRECTION_DIVISOR / (distToEnd + 1));
                const randomTurn = (Math.random() + Math.random() - 1) * RANDOM_TURN_AMOUNT;
                const turn = wrappedDiff * correction + randomTurn * (1 - correction);

                heading += turn;
                const length = Math.min(MAX_SEGMENT_LENGTH, distToEnd);
                pos.x += length * Math.cos(heading);
                pos.z += length * Math.sin(heading);
                currentSection.push({ ...pos });
                safety++;
            }
            //currentSection.push({ ...END });
            sections.push(currentSection);

            return { sections, roundabouts };
        }

        // ============================================
        // 4. GENERATE MAP AND BUILD WORLD
        // ============================================
        const { sections: roadSections, roundabouts } = generateRandomRoadMap();



        // Flatten all points (in driving order) for traffic light placement
        const allPoints = [];
        roadSections.forEach(section => {
            allPoints.push(...section);
        });

        // Ground
        const groundGeo = new THREE.PlaneGeometry(1200, 1200);
        groundGeo.rotateX(-Math.PI / 2);
        const ground = new THREE.Mesh(groundGeo, matGrass);
        ground.position.y = -0.08;
        ground.receiveShadow = true;
        scene.add(ground);

        // Road segments
        function createRoadSegment(x1, z1, x2, z2) {
            const dx = x2 - x1;
            const dz = z2 - z1;
            const length = Math.sqrt(dx * dx + dz * dz);
            if (length < 0.1) return;
            const angle = Math.atan2(dx, dz);
            const midX = (x1 + x2) / 2;
            const midZ = (z1 + z2) / 2;
            const geo = new THREE.BoxGeometry(ROAD_HALF_WIDTH * 2, ROAD_HEIGHT, length);
            const mesh = new THREE.Mesh(geo, matRoadMain);
            mesh.position.set(midX, ROAD_HEIGHT / 2, midZ);
            mesh.rotation.y = angle;
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        roadSections.forEach(section => {
            for (let i = 0; i < section.length - 1; i++) {
                createRoadSegment(section[i].x, section[i].z, section[i+1].x, section[i+1].z);
            }
        });

        // Roundabout rings
        roundabouts.forEach(r => {
            const inner = r.radius - ROAD_HALF_WIDTH;
            const outer = r.radius + ROAD_HALF_WIDTH;
            const ringGeo = new THREE.RingGeometry(inner, outer, 64);
            ringGeo.rotateX(-Math.PI / 2);
            const ringMesh = new THREE.Mesh(ringGeo, matRoadMain);
            ringMesh.position.set(r.cx, ROAD_HEIGHT / 2, r.cz);
            ringMesh.receiveShadow = true;
            scene.add(ringMesh);
        });

        // Start and end markers
        function createMarker(x, z, material, label) {
            const geo = new THREE.BoxGeometry(1.5, 0.4, 1.5);
            const marker = new THREE.Mesh(geo, material);
            marker.position.set(x, 0.2, z);
            marker.receiveShadow = true;
            marker.name = label;
            scene.add(marker);
        }
        createMarker(allPoints[0].x, allPoints[0].z, matStart, 'Start');
        createMarker(allPoints[allPoints.length-1].x, allPoints[allPoints.length-1].z, matEnd, 'End');

        // Trees (decorative)
        function createTree(x, z, scale = 1.0) {
            const group = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.18*scale, 0.22*scale, 1.6*scale, 8);
            const trunk = new THREE.Mesh(trunkGeo, matTrunk);
            trunk.position.y = 0.8*scale;
            trunk.castShadow = trunk.receiveShadow = true;
            group.add(trunk);
            const canopyGeo = new THREE.SphereGeometry(1.1*scale, 10, 8);
            canopyGeo.scale(1, 0.7, 1);
            const canopyMat = Math.random() > 0.5 ? matCanopy : matCanopyLight;
            const canopy = new THREE.Mesh(canopyGeo, canopyMat);
            canopy.position.y = 1.6*scale + 0.5*scale;
            canopy.castShadow = canopy.receiveShadow = true;
            group.add(canopy);
            group.position.set(x, 0, z);
            scene.add(group);
        }
        for (let i = 0; i < 80; i++) {
            createTree((Math.random()-0.5)*500, (Math.random()-0.5)*500, 0.7+Math.random()*1.0);
        }

        // ============================================
        // 5. TRAFFIC LIGHT SYSTEM
        // ============================================
        // --- Editable timing parameters (seconds) ---
        const TRAFFIC_LIGHT_DURATIONS = {
            red: 5,        // time for red
            redAmber: 2,   // time for red + amber
            green: 5,      // time for green
            amber: 2       // time for steady amber
        };
        const PHASE_INDEX = { red: 0, redAmber: 1, green: 2, amber: 3 };
        const PHASE_DURATIONS = [
            TRAFFIC_LIGHT_DURATIONS.red,
            TRAFFIC_LIGHT_DURATIONS.redAmber,
            TRAFFIC_LIGHT_DURATIONS.green,
            TRAFFIC_LIGHT_DURATIONS.amber
        ];

        // Choose a random position on the road (excluding first 3 and last 3 points)
        const minTrafficIndex = 3;
        const maxTrafficIndex = allPoints.length - 4; // exclusive
        const trafficIndex = minTrafficIndex + Math.floor(Math.random() * (maxTrafficIndex - minTrafficIndex + 1));
        const trafficPos = allPoints[trafficIndex];


        // ----- Create top-down traffic light (three flat circles on the ground) -----
        const trafficGroup = new THREE.Group();

        // Parameters for the light lenses (top-down circles)
        const LENS_RADIUS = 0.6;              // radius of each coloured disc
        const LENS_OFFSET_Y = 0.05;           // just above road to prevent z-fighting
        const LENS_GAP = 0.3;                 // horizontal gap between circles

        // Create three flat circles, arranged in a row (red, amber, green)
        const lensGeo = new THREE.CircleGeometry(LENS_RADIUS, 32);

        // Materials – use MeshBasicMaterial so we can simply change the colour
        const lensRedMaterial = new THREE.MeshBasicMaterial({ color: '#333333' });     // start off (dark)
        const lensAmberMaterial = new THREE.MeshBasicMaterial({ color: '#333333' });
        const lensGreenMaterial = new THREE.MeshBasicMaterial({ color: '#333333' });

        // Optional small base/housing (a dark rectangle beneath the lenses)
        // const baseGeo = new THREE.BoxGeometry((LENS_RADIUS * 2 + LENS_GAP) * 2 + 0.5, 0.1, 0.8);
        // const baseMat = new THREE.MeshLambertMaterial({ color: '#222222' });
        // const base = new THREE.Mesh(baseGeo, baseMat);
        // base.position.set(0, 0.03, 0);
        // base.receiveShadow = true;
        // trafficGroup.add(base);

        // Red lens (leftmost)
        const lensRed = new THREE.Mesh(lensGeo, lensRedMaterial);
        lensRed.rotation.x = -Math.PI / 2;     // lie flat on the ground
        lensRed.position.set(-LENS_GAP - LENS_RADIUS, LENS_OFFSET_Y, 0);
        trafficGroup.add(lensRed);

        // Amber lens (middle)
        const lensAmber = new THREE.Mesh(lensGeo, lensAmberMaterial);
        lensAmber.rotation.x = -Math.PI / 2;
        lensAmber.position.set(0, LENS_OFFSET_Y, 0);
        trafficGroup.add(lensAmber);

        // Green lens (rightmost)
        const lensGreen = new THREE.Mesh(lensGeo, lensGreenMaterial);
        lensGreen.rotation.x = -Math.PI / 2;
        lensGreen.position.set(LENS_GAP + LENS_RADIUS, LENS_OFFSET_Y, 0);
        trafficGroup.add(lensGreen);



        // Position the whole traffic light group at the stop line location
        trafficGroup.position.set(trafficPos.x, 0.06, trafficPos.z);
        // Rotate the group so the row of lenses is perpendicular to the road direction
        // (i.e., across the road) – this will be set after computing road direction.
        trafficGroup.renderOrder = 2;
        scene.add(trafficGroup);


        // ----- White stop line across the road -----
        // Determine road direction at the traffic light position.
        // We need two consecutive points in allPoints that are around the traffic index.
        const prevPoint = allPoints[Math.max(0, trafficIndex - 1)];
        const nextPoint = allPoints[Math.min(allPoints.length - 1, trafficIndex + 1)];
        const directionX = nextPoint.x - prevPoint.x;
        const directionZ = nextPoint.z - prevPoint.z;
        const dirLength = Math.hypot(directionX, directionZ) || 1;  // avoid divide by zero
        const roadDirX = directionX / dirLength;
        const roadDirZ = directionZ / dirLength;

        // Offset: place the stop line 5 units BEFORE the traffic light along the road.
        const STOP_LINE_OFFSET = 5.0;   // ← change this to adjust distance

        const lineCenter = {
            x: trafficPos.x - roadDirX * STOP_LINE_OFFSET,
            z: trafficPos.z - roadDirZ * STOP_LINE_OFFSET
        };

        // Perpendicular vector for width
        const perpX = -roadDirZ;
        const perpZ = roadDirX;

        // Line endpoints (left and right road edges)
        const lineLeftX = lineCenter.x - perpX * ROAD_HALF_WIDTH;
        const lineLeftZ = lineCenter.z - perpZ * ROAD_HALF_WIDTH;
        const lineRightX = lineCenter.x + perpX * ROAD_HALF_WIDTH;
        const lineRightZ = lineCenter.z + perpZ * ROAD_HALF_WIDTH;

        // Create the white line mesh (thin box lying on the ground)
        const stopLineGeo = new THREE.BoxGeometry(0.2, 0.05, ROAD_HALF_WIDTH * 2);
        const stopLineMat = new THREE.MeshLambertMaterial({ color: '#ffffff' });
        const stopLine = new THREE.Mesh(stopLineGeo, stopLineMat);
        // Position at midpoint of the line, with rotation to align with the perpendicular direction
        const midX = (lineLeftX + lineRightX) / 2;
        const midZ = (lineLeftZ + lineRightZ) / 2;
        stopLine.position.set(midX, 0.06, midZ);
        // Rotate so its length aligns with the perpendicular direction
        stopLine.rotation.y = Math.atan2(perpX, perpZ);
        stopLine.receiveShadow = true;
        stopLine.renderOrder = 2;
        scene.add(stopLine);



        // Traffic light state
        let currentPhase = Math.floor(Math.random() * 4); // 0:red, 1:redAmber, 2:green, 3:amber
        let phaseTimer = Math.random() * PHASE_DURATIONS[currentPhase]; // random start within phase

        function setTrafficLightPhase(phase) {
            // Off state: dark grey
            lensRedMaterial.color.set('#333333');
            lensAmberMaterial.color.set('#333333');
            lensGreenMaterial.color.set('#333333');

            if (phase === PHASE_INDEX.red) {
                lensRedMaterial.color.set('#ff0000');         // bright red
            } else if (phase === PHASE_INDEX.redAmber) {
                lensRedMaterial.color.set('#ff0000');
                lensAmberMaterial.color.set('#ffaa00');       // amber
            } else if (phase === PHASE_INDEX.green) {
                lensGreenMaterial.color.set('#00ff00');       // bright green
            } else if (phase === PHASE_INDEX.amber) {
                lensAmberMaterial.color.set('#ffaa00');
            }
        }


        function updateTrafficLight(dt) {
            phaseTimer += dt;
            if (phaseTimer >= PHASE_DURATIONS[currentPhase]) {
                phaseTimer = 0;
                currentPhase = (currentPhase + 1) % 4;
                console.log('current phase:');
                console.log(currentPhase);
                setTrafficLightPhase(currentPhase);
            }
        }

        // Initial phase
        setTrafficLightPhase(currentPhase);

        // ============================================
        // 6. COLLISION DETECTION (off‑road + red light)
        // ============================================
        function pointToSegmentDistance(px, pz, ax, az, bx, bz) {
            const dx = bx - ax, dz = bz - az;
            const lenSq = dx*dx + dz*dz;
            if (lenSq === 0) return Math.hypot(px-ax, pz-az);
            let t = ((px-ax)*dx + (pz-az)*dz) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (ax + t*dx), pz - (az + t*dz));
        }

        function isCarOnRoad() {
            const cx = carGroup.position.x, cz = carGroup.position.z;
            for (const section of roadSections) {
                for (let i = 0; i < section.length-1; i++) {
                    if (pointToSegmentDistance(cx, cz, section[i].x, section[i].z, section[i+1].x, section[i+1].z) <= ROAD_HALF_WIDTH) return true;
                }
            }
            for (const r of roundabouts) {
                const dx = cx - r.cx, dz = cz - r.cz;
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist >= r.radius - ROAD_HALF_WIDTH && dist <= r.radius + ROAD_HALF_WIDTH) return true;
            }
            return false;
        }

        function isCarAtRedLight() {
            // Crossing means the car is within a small radius of the traffic light position
            const dx = carGroup.position.x - trafficPos.x;
            const dz = carGroup.position.z - trafficPos.z;
            const dist = Math.sqrt(dx*dx + dz*dz);
            return dist < 1.5;
        }
        /**
         * Returns true if the car has crossed the white stop line.
         * The stop line is defined by its centre (lineCenter) and the road direction (roadDir).
         * The car is considered to have crossed if it is on the road (laterally) and
         * its projection along the road direction is greater than zero (i.e., past the line).
         */
        function hasCarCrossedStopLine() {
            const carX = carGroup.position.x;
            const carZ = carGroup.position.z;

            // Vector from line centre to car
            const dx = carX - lineCenter.x;
            const dz = carZ - lineCenter.z;

            // Projection onto road direction (positive = beyond the line in the direction of travel)
            const proj = dx * roadDirX + dz * roadDirZ;

            // Check if the car is laterally within the road width (so it's actually on the road)
            const lateralDist = Math.abs(dx * perpX + dz * perpZ);
            if (lateralDist > ROAD_HALF_WIDTH/2) return false;   // not on the road near the line

            // Car has crossed if its projection is positive and it is within the line's vicinity
            // (we could also add a small tolerance, e.g., proj > 0.5)
            return proj > 0;
        }

        function resetCarToSpawn() {
            carGroup.position.set(allPoints[0].x, 0.08, allPoints[0].z);
            carState.speed = 0;
            carState.heading = Math.PI/2;            // face upward? Actually initial direction is east? Wait, start is (0,0) and first segment to (40,0) east, so heading = 0. We'll set to 0.
            carGroup.rotation.y = 0;               // facing east
            totalFuelUsed = 0;
            elapsedTime = 0;
            gameCompleted = false;
            document.getElementById('completion-overlay').style.display = 'none';
        }

        // ============================================
        // 7. CAR CREATION
        // ============================================
        const carGroup = new THREE.Group();
        carGroup.name = 'PlayerCar';

        const shadowGeo = new THREE.PlaneGeometry(2.2, 4.2);
        shadowGeo.rotateX(-Math.PI/2);
        const shadow = new THREE.Mesh(shadowGeo, matCarShadow);
        shadow.position.y = 0.04;
        shadow.renderOrder = 1;
        carGroup.add(shadow);

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.35,3.8), matCarBody);
        body.position.y = 0.4;
        body.castShadow = body.receiveShadow = true;
        carGroup.add(body);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.45,0.22,1.7), matCarWindow);
        cabin.position.set(0,0.62,-0.1);
        cabin.castShadow = true;
        carGroup.add(cabin);

        const wheelGeo = new THREE.BoxGeometry(0.4,0.22,0.7);
        [[-0.95,1.3],[0.95,1.3],[-0.95,-1.3],[0.95,-1.3]].forEach(([x,z]) => {
            const w = new THREE.Mesh(wheelGeo, matCarWheel);
            w.position.set(x,0.2,z);
            w.castShadow = true;
            carGroup.add(w);
        });

        const hlGeo = new THREE.BoxGeometry(0.25,0.08,0.2);
        const hlMat = new THREE.MeshPhongMaterial({ color:'#ffffcc', emissive:'#ffffaa', emissiveIntensity:0.5 });
        [[-0.55,1.85],[0.55,1.85]].forEach(([x,z]) => {
            const h = new THREE.Mesh(hlGeo, hlMat);
            h.position.set(x,0.45,z);
            carGroup.add(h);
        });
        const tlGeo = new THREE.BoxGeometry(0.25,0.08,0.2);
        const tlMat = new THREE.MeshPhongMaterial({ color:'#ff2222', emissive:'#ff0000', emissiveIntensity:0.4 });
        [[-0.55,-1.85],[0.55,-1.85]].forEach(([x,z]) => {
            const t = new THREE.Mesh(tlGeo, tlMat);
            t.position.set(x,0.45,z);
            carGroup.add(t);
        });

        carGroup.position.set(allPoints[0].x, 0.08, allPoints[0].z);
        carGroup.rotation.y = 0;   // facing east (heading = 0)
        scene.add(carGroup);

        // ============================================
        // 8. GAME STATE
        // ============================================
        const carState = {
            speed: 0,
            heading: Math.PI/2,   // east
        };

        let totalFuelUsed = 0.0;
        let elapsedTime = 0.0;
        let gameCompleted = false;

        const PHYSICS = {
            maxForwardSpeed: 22,
            maxReverseSpeed: 10,
            acceleration: 14,
            braking: 18,
            reverseAcceleration: 10,
            friction: 5,
            turnRate: 3.2,
            turnRateAtLowSpeed: 4.5,
            minSpeedForTurning: 0.3,
        };
        const FUEL_CONSUMPTION_RATE = 0.25;

        // ============================================
        // 9. INPUT HANDLING
        // ============================================
        const inputState = { forward: false, backward: false, left: false, right: false };

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
            if (gameCompleted) return;
            switch (e.key) {
                case 'ArrowUp': inputState.forward = true; break;
                case 'ArrowDown': inputState.backward = true; break;
                case 'ArrowLeft': inputState.left = true; break;
                case 'ArrowRight': inputState.right = true; break;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (gameCompleted) return;
            switch (e.key) {
                case 'ArrowUp': inputState.forward = false; break;
                case 'ArrowDown': inputState.backward = false; break;
                case 'ArrowLeft': inputState.left = false; break;
                case 'ArrowRight': inputState.right = false; break;
            }
        });
        // ============================================
        // TOUCH CONTROLS (mobile support)
        // ============================================
        function bindTouchButton(buttonId, inputKey) {
            const btn = document.getElementById(buttonId);
            if (!btn) return;

            const setState = (value) => (inputState[inputKey] = value);

            // Touch events
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                setState(true);
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                setState(false);
            });
            btn.addEventListener('touchcancel', (e) => {
                setState(false);
            });

            // Mouse fallback (for testing on desktop)
            btn.addEventListener('mousedown', () => setState(true));
            btn.addEventListener('mouseup', () => setState(false));
            btn.addEventListener('mouseleave', () => setState(false));
        }

        bindTouchButton('btn-up', 'forward');
        bindTouchButton('btn-down', 'backward');
        bindTouchButton('btn-left', 'left');
        bindTouchButton('btn-right', 'right');

        // ============================================
        // 10. GAME LOOP
        // ============================================
        const clock = new THREE.Clock();

        function gameLoop() {
            const dt = Math.min(clock.getDelta(), 0.1);

            if (!gameCompleted) {
                // Update physics
                updateCarPhysics(dt);

                // Fuel consumption
                if (inputState.forward) totalFuelUsed += FUEL_CONSUMPTION_RATE * dt;
                elapsedTime += dt;

                // Traffic light update
                updateTrafficLight(dt);

                // Check off‑road
                if (!isCarOnRoad()) {
                    resetCarToSpawn();
                } else {
                    // Check red light
                    if (hasCarCrossedStopLine() && (currentPhase === PHASE_INDEX.red || currentPhase === PHASE_INDEX.redAmber)) {
                        //alert('⚠️ Ran red light! Respawn.');
                        resetCarToSpawn();
                    }
                }

                // Check finish
                const dx = carGroup.position.x - allPoints[allPoints.length-1].x;
                const dz = carGroup.position.z - allPoints[allPoints.length-1].z;
                if (Math.sqrt(dx*dx + dz*dz) < 3.0) {
                    gameCompleted = true;
                    carState.speed = 0;
                    document.getElementById('final-time').textContent = elapsedTime.toFixed(1);
                    document.getElementById('final-fuel').textContent = totalFuelUsed.toFixed(1);
                    document.getElementById('completion-overlay').style.display = 'block';
                }
            }

            updateCamera();
            renderer.render(scene, camera);
            updateHUD();
            requestAnimationFrame(gameLoop);
        }

        function updateCarPhysics(dt) {
            const { speed, heading } = carState;
            const absSpeed = Math.abs(speed);

            let acceleration = 0;
            if (inputState.forward) {
                if (speed < 0) {
                    acceleration = PHYSICS.braking;
                } else {
                    acceleration = PHYSICS.acceleration;
                }
            } else if (inputState.backward) {
                if (speed > 0) {
                    acceleration = -PHYSICS.braking;
                } else {
                    acceleration = -PHYSICS.reverseAcceleration;
                }
            } else {
                if (absSpeed < 0.05) {
                    carState.speed = 0;
                } else if (speed > 0) {
                    acceleration = -PHYSICS.friction;
                } else {
                    acceleration = PHYSICS.friction;
                }
            }

            carState.speed += acceleration * dt;
            if (carState.speed > PHYSICS.maxForwardSpeed) carState.speed = PHYSICS.maxForwardSpeed;
            if (carState.speed < -PHYSICS.maxReverseSpeed) carState.speed = -PHYSICS.maxReverseSpeed;

            const currentAbsSpeed = Math.abs(carState.speed);
            let effectiveTurnRate;
            if (currentAbsSpeed < PHYSICS.minSpeedForTurning) {
                effectiveTurnRate = PHYSICS.turnRateAtLowSpeed * (currentAbsSpeed / PHYSICS.minSpeedForTurning + 0.15);
                effectiveTurnRate = Math.min(effectiveTurnRate, PHYSICS.turnRateAtLowSpeed);
            } else {
                effectiveTurnRate = PHYSICS.turnRate * Math.min(currentAbsSpeed / PHYSICS.maxForwardSpeed, 1.0);
            }

            const turnDirection = carState.speed >= 0 ? 1 : -1;
            if (inputState.left) carState.heading += effectiveTurnRate * dt * turnDirection;
            if (inputState.right) carState.heading -= effectiveTurnRate * dt * turnDirection;
            carState.heading = carState.heading % (Math.PI * 2);

            const forwardX = Math.sin(carState.heading);
            const forwardZ = Math.cos(carState.heading);
            carGroup.position.x += carState.speed * forwardX * dt;
            carGroup.position.z += carState.speed * forwardZ * dt;
            carGroup.rotation.y = carState.heading;
        }        

        function updateCamera() {
            const tx = carGroup.position.x, tz = carGroup.position.z;
            const lerp = 0.12;
            camera.position.x += (tx - camera.position.x) * lerp;
            camera.position.z += (tz - camera.position.z) * lerp;
            camera.position.y = 60;
            camera.lookAt(camera.position.x, 0, camera.position.z);
        }

        function updateHUD() {
            document.getElementById('speed-value').textContent = Math.round(Math.abs(carState.speed) * 3.6);
            document.getElementById('fuel-value').textContent = totalFuelUsed.toFixed(1);
            document.getElementById('time-value').textContent = elapsedTime.toFixed(1);
        }

        // ============================================
        // 11. WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            const aspect = window.innerWidth / window.innerHeight;
            viewWidth = VIEW_HEIGHT * aspect;
            camera.left = -viewWidth/2;
            camera.right = viewWidth/2;
            camera.top = VIEW_HEIGHT/2;
            camera.bottom = -VIEW_HEIGHT/2;
            camera.updateProjectionMatrix();
        });

        // Start
        console.log('🚗 Random road with traffic light ready!');
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
